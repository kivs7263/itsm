worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Rate limit zones ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=portal_limit:10m  rate=30r/m;
    limit_req_status 429;

    # ── Upstream (deferred DNS resolution) ───────────────────────
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;

        # ── Health check ─────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # ── 내부 전용 경로 외부 차단 (ADR-048 WF-2) ─────────────
        # /api/internal/* 는 서비스 간 내부 통신 전용 — 외부 인터넷 접근 불가.
        location /api/internal/ {
            deny all;
            return 403;
        }

        # ── Backend API ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            set $backend http://itsm_backend:8000;
            proxy_pass $backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── SSO 콜백 — rate limit 제외 (KC가 brute force 차단 담당) ──
        location /api/auth/sso {
            set $backend http://itsm_backend:8000;
            proxy_pass $backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth endpoints (엄격한 rate limit) ───────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            set $backend http://itsm_backend:8000;
            proxy_pass $backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── SSE (Server-Sent Events) ─────────────────────────────
        location /api/stream/ {
            set $backend http://itsm_backend:8000;
            proxy_pass $backend;

            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  Connection        "";
            proxy_http_version 1.1;
            proxy_buffering   off;
            proxy_cache       off;
            proxy_read_timeout 3600s;
        }

        # ── 고객 셀프서비스 포털 (별도 rate limit) ───────────────
        location /portal/ {
            limit_req zone=portal_limit burst=10 nodelay;

            set $frontend http://itsm_frontend:3000;
            proxy_pass $frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Next.js 정적 자산 ────────────────────────────────────
        location /_next/ {
            set $frontend http://itsm_frontend:3000;
            proxy_pass $frontend;

            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        # ── Frontend (catch-all) ─────────────────────────────────
        location / {
            set $frontend http://itsm_frontend:3000;
            proxy_pass $frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}
