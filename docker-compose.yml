services:
  # ── nginx (리버스 프록시) ──────────────────────────────────────────
  itsm_nginx:
    image: nginx:1.25-alpine
    container_name: itsm_nginx
    restart: unless-stopped
    ports:
      - "8890:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - itsm_frontend
      - itsm_backend
    networks:
      - itsm_internal
      - itsm_edge
      - service_mesh

  # ── frontend ──────────────────────────────────────────────────────
  itsm_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ITSM_URL: ${NEXT_PUBLIC_ITSM_URL:-}
        NEXT_PUBLIC_SA_URL: ${NEXT_PUBLIC_SA_URL:-}
        NEXT_PUBLIC_GW_URL: ${NEXT_PUBLIC_GW_URL:-}
        NEXT_PUBLIC_ADMIN_PORTAL_URL: ${NEXT_PUBLIC_ADMIN_PORTAL_URL:-}
    container_name: itsm_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - itsm_internal

  # ── backend ───────────────────────────────────────────────────────
  itsm_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_user:${POSTGRES_PASSWORD}@itsm_postgres_ha:5000/itsm
      REDIS_URL: redis://itsm_redis:6379/0
      MEILISEARCH_HOST: http://itsm_meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MINIO_ENDPOINT: itsm_minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: itsm-files
      SERVICE_BUS_SECRET: ${SERVICE_BUS_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      SA_BACKEND_URL: ${SA_BACKEND_URL:-http://sa_backend:8000}
    depends_on:
      itsm_postgres_ha:
        condition: service_healthy
      itsm_redis:
        condition: service_healthy
    networks:
      - itsm_internal
      - service_mesh

  # ── SLA 워커 ──────────────────────────────────────────────────────
  itsm_sla_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm_sla_worker
    restart: unless-stopped
    command: python -m app.workers.sla_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_user:${POSTGRES_PASSWORD}@itsm_postgres_ha:5000/itsm
      REDIS_URL: redis://itsm_redis:6379/0
      SERVICE_BUS_SECRET: ${SERVICE_BUS_SECRET}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      itsm_postgres_ha:
        condition: service_healthy
      itsm_redis:
        condition: service_healthy
    networks:
      - itsm_internal

  # ── Email 워커 (IMAP 폴링 → 티켓 자동 생성) ──────────────────────
  itsm_email_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm_email_worker
    restart: unless-stopped
    command: python -m app.workers.email_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_user:${POSTGRES_PASSWORD}@itsm_postgres_ha:5000/itsm
      REDIS_URL: redis://itsm_redis:6379/0
      SERVICE_BUS_SECRET: ${SERVICE_BUS_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_TENANT_SLUG: ${IMAP_TENANT_SLUG:-}
      EMAIL_INTERVAL_SECONDS: ${EMAIL_INTERVAL_SECONDS:-60}
    depends_on:
      itsm_postgres_ha:
        condition: service_healthy
      itsm_redis:
        condition: service_healthy
    networks:
      - itsm_internal

  # ── Bridge 워커 (ITSM → SA KPI push) ──────────────────────────────
  itsm_bridge_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm_bridge_worker
    restart: unless-stopped
    command: python -m app.workers.bridge_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_user:${POSTGRES_PASSWORD}@itsm_postgres_ha:5000/itsm
      REDIS_URL: redis://itsm_redis:6379/0
      SERVICE_BUS_SECRET: ${SERVICE_BUS_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      SA_BACKEND_URL: ${SA_BACKEND_URL:-}
    depends_on:
      itsm_postgres_ha:
        condition: service_healthy
      itsm_redis:
        condition: service_healthy
    networks:
      - itsm_internal

  # ── PostgreSQL HA ─────────────────────────────────────────────────
  itsm_postgres_primary:
    image: pgvector/pgvector:pg16
    container_name: itsm_postgres_primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itsm
    volumes:
      - itsm_postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm_user -d itsm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_internal

  itsm_postgres_standby:
    image: pgvector/pgvector:pg16
    container_name: itsm_postgres_standby
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itsm
    volumes:
      - itsm_postgres_standby_data:/var/lib/postgresql/data
    depends_on:
      - itsm_postgres_primary
    networks:
      - itsm_internal

  itsm_postgres_ha:
    image: haproxy:2.9-alpine
    container_name: itsm_postgres_ha
    restart: unless-stopped
    volumes:
      - ./postgres/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      itsm_postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - itsm_internal

  # ── Redis ─────────────────────────────────────────────────────────
  itsm_redis:
    image: redis:7-alpine
    container_name: itsm_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - itsm_internal

  # ── Meilisearch ───────────────────────────────────────────────────
  itsm_meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: itsm_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - itsm_meilisearch_data:/meili_data
    networks:
      - itsm_internal

  # ── MinIO ─────────────────────────────────────────────────────────
  itsm_minio:
    image: minio/minio:latest
    container_name: itsm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - itsm_minio_data:/data
    networks:
      - itsm_internal

  itsm_minio_init:
    image: minio/mc:latest
    container_name: itsm_minio_init
    depends_on:
      - itsm_minio
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://itsm_minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc mb --ignore-existing local/itsm-files;
        mc anonymous set none local/itsm-files;
      "
    networks:
      - itsm_internal

  # ── 모니터링 ─────────────────────────────────────────────────────
  itsm_prometheus:
    image: prom/prometheus:latest
    container_name: itsm_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - itsm_prometheus_data:/prometheus
    networks:
      - itsm_internal

  itsm_promtail:
    image: grafana/promtail:latest
    container_name: itsm_promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    networks:
      - itsm_internal

networks:
  itsm_internal:
    driver: bridge
  itsm_edge:
    name: itsm_edge
    driver: bridge
  service_mesh:
    external: true

volumes:
  itsm_postgres_primary_data:
  itsm_postgres_standby_data:
  itsm_meilisearch_data:
  itsm_minio_data:
  itsm_prometheus_data:
